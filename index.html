<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verifier</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background:
        radial-gradient(ellipse 60% 40% at 78% 8%,  rgba(0, 230, 118, 0.13) 0%, transparent 55%),
        radial-gradient(ellipse 40% 45% at 12% 92%, rgba(0, 200, 100, 0.07) 0%, transparent 50%),
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0, 60, 30,  0.25) 0%, transparent 65%),
        #050907;
      color: #e8e8e8;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* ── Titlebar ── */
    .titlebar {
      -webkit-app-region: drag;
      height: 40px;
      background: rgba(8, 14, 10, 0.72);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(0, 230, 118, 0.07);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.03);
    }

    .titlebar span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
    }

    /* ── Options bar ── */
    .options-bar {
      display: flex;
      align-items: center;
      gap: 32px;
      padding: 16px 28px;
      background: rgba(10, 20, 14, 0.62);
      backdrop-filter: blur(24px) saturate(170%);
      -webkit-backdrop-filter: blur(24px) saturate(170%);
      border-bottom: 1px solid rgba(0, 230, 118, 0.08);
      box-shadow:
        inset 0  1px 0 rgba(255,255,255,0.04),
        inset 0 -1px 0 rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    .option-label {
      font-size: 14px;
      font-weight: 500;
      color: rgba(200, 220, 210, 0.85);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.15s;
    }

    .option-label:hover { color: #fff; }

    .option-label:focus-within {
      outline: 2px solid rgba(0,230,118,0.5);
      outline-offset: 5px;
      border-radius: 4px;
    }

    .option-label input[type="checkbox"] {
      accent-color: #00e676;
      cursor: pointer;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ── Columns ── */
    .columns {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .column:first-child {
      border-right: 1px solid rgba(255,255,255,0.05);
    }

    .col-header {
      padding: 11px 18px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: rgba(180, 210, 195, 0.6);
      text-transform: uppercase;
      background: rgba(6, 14, 9, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .char-count {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0;
      color: rgba(255,255,255,0.28);
    }

    textarea {
      flex: 1;
      width: 100%;
      background: rgba(4, 8, 6, 0.35);
      color: #dce8e2;
      border: none;
      outline: none;
      resize: none;
      padding: 20px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.75;
      tab-size: 2;
      caret-color: #00e676;
      user-select: text;
      transition: background 0.2s, box-shadow 0.2s;
    }

    textarea::placeholder { color: rgba(255,255,255,0.12); }

    textarea:focus {
      background: rgba(0, 230, 118, 0.02);
      box-shadow: inset 0 0 0 1px rgba(0, 230, 118, 0.1);
      outline: none;
    }

    /* ── Result panel ── */
    .result-panel {
      flex-shrink: 0;
      min-height: 78px;
      background: rgba(3, 7, 5, 0.82);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border-top: 1px solid rgba(0, 230, 118, 0.1);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      gap: 16px;
    }

    .result-badge {
      display: flex;
      align-items: center;
      gap: 18px;
      position: relative;
    }

    /* Glow aura behind badge */
    .badge-aura {
      position: absolute;
      left: -10px;
      width: 110px;
      height: 50px;
      border-radius: 50%;
      filter: blur(28px);
      opacity: 0;
      transition: background 0.25s, opacity 0.25s;
      pointer-events: none;
      z-index: 0;
    }

    .badge-aura.true  { background: #00e676; opacity: 0.35; }
    .badge-aura.false { background: #ff5c7a; opacity: 0.28; }

    .badge {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.05em;
      transition: color 0.2s, text-shadow 0.2s;
      position: relative;
      z-index: 1;
      min-width: 94px;
    }

    .badge.true {
      color: #00e676;
      text-shadow:
        0 0 20px rgba(0, 230, 118, 0.9),
        0 0 50px rgba(0, 230, 118, 0.4);
    }

    .badge.false {
      color: #ff5c7a;
      text-shadow:
        0 0 20px rgba(255, 92, 122, 0.9),
        0 0 50px rgba(255, 92, 122, 0.4);
    }

    .badge.empty { color: rgba(255,255,255,0.15); }

    .result-detail {
      font-size: 12px;
      color: rgba(180, 200, 190, 0.55);
      line-height: 1.65;
      position: relative;
      z-index: 1;
    }

    .result-detail .diff-count  { color: #ff5c7a; font-weight: 600; }
    .result-detail .match-count { color: #00e676; font-weight: 600; }

    /* ── Buttons ── */
    .action-btns { display: flex; gap: 8px; flex-shrink: 0; }

    button {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(200, 220, 210, 0.8);
      padding: 9px 18px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 6px;
      letter-spacing: 0.04em;
      transition: background 0.12s, color 0.12s, border-color 0.12s, box-shadow 0.12s;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    button:focus-visible {
      outline: 2px solid rgba(0, 230, 118, 0.5);
      outline-offset: 2px;
    }

    button.primary {
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid rgba(0, 230, 118, 0.3);
      color: #00e676;
      box-shadow: 0 0 16px rgba(0, 230, 118, 0.08);
    }

    button.primary:hover {
      background: rgba(0, 230, 118, 0.18);
      border-color: rgba(0, 230, 118, 0.55);
      color: #33ffaa;
      box-shadow: 0 0 24px rgba(0, 230, 118, 0.18);
    }

    /* ── Live dot ── */
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 6px #00e676, 0 0 12px rgba(0,230,118,0.4);
      display: inline-block;
      flex-shrink: 0;
    }

    .live-dot.off {
      background: rgba(255,255,255,0.2);
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="titlebar" role="banner">
    <span>Verifier</span>
  </div>

  <div class="options-bar" role="toolbar" aria-label="Comparison options">
    <label class="option-label">
      <span class="live-dot" id="liveDot" aria-hidden="true"></span>
      <input type="checkbox" id="liveToggle" checked aria-label="Live compare" />
      Live compare
    </label>
    <label class="option-label">
      <input type="checkbox" id="caseSensitive" aria-label="Case sensitive" />
      Case sensitive
    </label>
    <label class="option-label">
      <input type="checkbox" id="trimWhitespace" checked aria-label="Trim whitespace" />
      Trim whitespace
    </label>
    <label class="option-label">
      <input type="checkbox" id="ignoreNewlines" aria-label="Ignore newlines" />
      Ignore newlines
    </label>
  </div>

  <div class="columns" role="main">
    <div class="column">
      <div class="col-header">
        <span>Column A</span>
        <span class="char-count" id="countA" aria-live="polite">0 chars</span>
      </div>
      <textarea id="colA" aria-label="Column A input" placeholder="Paste string, paragraph, essay, or code here..."></textarea>
    </div>
    <div class="column">
      <div class="col-header">
        <span>Column B</span>
        <span class="char-count" id="countB" aria-live="polite">0 chars</span>
      </div>
      <textarea id="colB" aria-label="Column B input" placeholder="Paste string, paragraph, essay, or code here..."></textarea>
    </div>
  </div>

  <div class="result-panel" role="status" aria-live="polite" aria-label="Comparison result">
    <div class="result-badge">
      <span class="badge-aura" id="badgeAura"></span>
      <span class="badge empty" id="resultBadge" aria-label="Result">—</span>
      <div class="result-detail" id="resultDetail">Enter content in both columns to compare.</div>
    </div>
    <div class="action-btns">
      <button id="copyBtn">Copy Result</button>
      <button id="swapBtn">Swap A ↔ B</button>
      <button id="clearBtn">Clear All</button>
      <button class="primary" id="compareBtn">Compare</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
